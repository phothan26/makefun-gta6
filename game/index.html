<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HARBOR — Golden Hour Run</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1026; height: 100%; overflow: hidden; }
  /* Top-aligned, not vertically centered: the canvas plus the hint bar
     is taller than a 1280x720 viewport, and centering them puts the
     canvas half a pixel off the viewport edge — which made element
     screenshots come out 1280x721 instead of 1280x720. Top-aligned,
     the canvas sits exactly at y=0 and screenshots are exact. */
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; font-family: sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; background: #0b1026; }
  #bar { color: #ffd166; font-size: 13px; padding: 6px 0 0 0; letter-spacing: 1px; }
  #bar b { color: #fff; }
  #bar span { margin: 0 10px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="bar"><b>VICE HARBOR</b><span>—</span>Golden Hour Run<span>WASD / arrows — drive &amp; walk</span><span>E — enter / exit</span><span>G — Ghost Mode (in fog)</span><span>1 / 2 / 3 — radio</span><span>M — mute</span></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
